<!doctype html>
<!-- Demo site with deliberately planted accessibility failures. Each one is labelled PLANTED. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us | Maple Grove Library</title>
<style>
  body { font-family: Georgia, serif; margin: 0; color: #222; }
  header { background: #2b4c3f; padding: 1rem; }
  nav a { color: #fff; margin-right: 1rem; }
  .skip { position: absolute; left: -9999px; }
  .skip:focus { left: 1rem; top: 1rem; background: #fff; padding: 0.5rem; }
  main { padding: 1rem; }
  label, input, textarea { display: block; margin-bottom: 0.75rem; }
  .required { border: 2px solid #d33; }
  button { background: #7fa391; color: #fff; border: 0; padding: 0.6rem 1.2rem; }  /* PLANTED 1.4.3: 2.8:1 */
  footer { padding: 1rem; border-top: 1px solid #ccc; }
</style>
</head>
<body>
<a href="#content" class="skip">Skip to content</a>  <!-- PLANTED 2.4.1: target id doesn't exist -->
<header>
  <nav>
    <a href="index.html">Home</a><a href="events.html">Events</a><a href="contact.html">Contact</a>
  </nav>
</header>
<main>
  <h1>Contact us</h1>
  <p>Fields marked in red are required.</p>  <!-- PLANTED 1.4.1 / 1.3.3 (AI): colour-only instruction -->
  <form>
    <input type="text" class="required" placeholder="Your name">  <!-- PLANTED 4.1.2 / 3.3.2: no label -->
    <label for="email">Email</label>
    <input type="email" id="email" class="required">
    <label for="msg">Message</label>
    <textarea id="msg" rows="4"></textarea>
    <button type="submit">Send</button>
  </form>
</main>
<footer>
  <a href="index.html">Back to home</a>
</footer>
<script>
  // PLANTED 2.1.2: keyboard trap. Tab can never leave the message box.
  document.getElementById("msg").addEventListener("keydown", (e) => {
    if (e.key === "Tab") e.preventDefault();
  });
</script>
</body>
</html>

[project]
name = "wcag-scanner"
version = "0.1.0"
description = "Crawl a website and report WCAG 2.2 conformance, page by page and criterion by criterion."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "anthropic>=2.0",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
wcag-scanner = "wcag_scanner.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wcag_scanner*"]

[tool.setuptools.package-data]
wcag_scanner = ["static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: launches Chromium (slower; needs `playwright install chromium`)"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["wcag_scanner"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PL", "C4", "PIE", "RET"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity limits: checks are naturally branchy
  "RUF001", "RUF002", "RUF003",                           # intentional typographic characters in user text
  "PLC0415",                                              # lazy imports (uvicorn) are deliberate
  "E501",                                                 # the formatter owns layout; user-facing messages stay whole and greppable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
packages = ["wcag_scanner"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
